version: 2

project_name: sftpcommander

before:
  hooks:
    - go mod tidy

builds:
  - id: sftpcommander
    main: .
    binary: sftpcommander
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: 'checksums.txt'

snapshot:
  version_template: '{{ incpatch .Version }}-next'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: art-ps
    name: sftpcommander
  draft: false
  prerelease: auto

brews:
  - name: sftpcommander
    repository:
      owner: art-ps
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}'
    directory: Formula
    homepage: 'https://github.com/art-ps/sftpcommander'
    description: 'Terminal SFTP client with a keyboard-driven TUI'
    license: 'MIT'
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    install: |
      bin.install "sftpcommander"
